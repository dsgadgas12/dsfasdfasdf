<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>mog Маркет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#F5F9F6; --card:#FFFFFF; --line:#E4EDE7; --text:#16231B; --muted:#6B7F73;
  --g:#1FB36B; --g-dark:#169A58; --g-soft:#E6F6EE; --red:#E5484D; --red-soft:#FDECEC;
  --amber-bg:#FFF5DC; --amber-tx:#9A6A00; --gray-bg:#EEF2EF; --nav:rgba(255,255,255,.96);
  --top:rgba(245,249,246,.92); --ov:rgba(14,28,20,.4); --copy:#cfe0d5;
  --r:16px; --shadow:0 1px 2px rgba(22,35,27,.04),0 4px 14px rgba(22,35,27,.05);
}
:root[data-theme="dark"]{
  --bg:#0E1511; --card:#172019; --line:#243229; --text:#E7F0EA; --muted:#8CA195;
  --g:#27C27A; --g-dark:#34D58A; --g-soft:rgba(39,194,122,.14); --red:#FF6B70; --red-soft:rgba(255,107,112,.13);
  --amber-bg:rgba(232,163,23,.16); --amber-tx:#F0BE55; --gray-bg:#212C25; --nav:rgba(18,26,21,.96);
  --top:rgba(14,21,17,.92); --ov:rgba(0,0,0,.6); --copy:#34463a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;font-size:15px;transition:background .2s,color .2s}
body{padding-bottom:84px;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--top);backdrop-filter:blur(10px);
  padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;letter-spacing:-.2px}
.logo i{width:30px;height:30px;border-radius:10px;background:var(--g);display:grid;place-items:center;
  color:#fff;font-style:normal;font-weight:800;font-size:15px}
.logo span{color:var(--g)}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
.theme{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;
  display:grid;place-items:center;padding:0;flex:none}
.theme svg{width:19px;height:19px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding:4px 16px 16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.stack>*+*{margin-top:10px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
h2{margin:6px 0 10px;font-size:19px;letter-spacing:-.2px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--g);color:#fff;
  transition:.15s;width:100%}
.btn:active{transform:scale(.98);background:var(--g-dark)}
.btn.soft{background:var(--g-soft);color:var(--g-dark)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--text)}
.btn.red{background:var(--red-soft);color:var(--red)}
.btn.sm{width:auto;padding:8px 14px;font-size:14px}
.btn[disabled]{opacity:.5}
input,textarea,select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(31,179,107,.16)}
textarea{resize:none;min-height:84px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.tag{display:inline-block;background:var(--g-soft);color:var(--g-dark);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600}
.tag.amber{background:var(--amber-bg);color:var(--amber-tx)}.tag.red{background:var(--red-soft);color:var(--red)}.tag.gray{background:var(--gray-bg);color:var(--muted)}
.price{font-weight:700;font-size:17px;color:var(--g-dark);white-space:nowrap}
.item .t{font-weight:600;font-size:16px;margin:6px 0 3px}
.item .d{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bal{background:linear-gradient(135deg,#22B873,#16965A);color:#fff;border:0}
.bal .big{font-size:32px;font-weight:700;letter-spacing:-.8px;margin:4px 0 2px}
.bal .muted{color:rgba(255,255,255,.82)}
.empty{text-align:center;color:var(--muted);padding:36px 10px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--nav);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:600;display:flex;
  flex-direction:column;align-items:center;gap:3px;padding:4px;cursor:pointer}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--g)}
.fab{position:fixed;right:16px;bottom:88px;z-index:5;width:auto;box-shadow:0 8px 22px rgba(31,179,107,.35);border-radius:999px;padding:13px 20px}
.ov{position:fixed;inset:0;background:var(--ov);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  max-height:90vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:6px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--g-dark);box-shadow:var(--shadow)}
.copy{background:var(--bg);border:1px dashed var(--copy);border-radius:12px;padding:11px 12px;word-break:break-all;font-size:13.5px;cursor:pointer}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#16231B;color:#fff;padding:10px 16px;
  border-radius:12px;z-index:50;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:90%}
.toast.show{opacity:1}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}
.kv b{font-weight:600;text-align:right}
/* карточки лотов */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{position:relative;border-radius:20px;padding:10px;color:#fff;cursor:pointer;overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:214px}
.gcard::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.22),transparent 62%);pointer-events:none}
.ico{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.22);
  display:grid;place-items:center;cursor:pointer;padding:0;position:absolute;top:10px}
.ico.l{left:10px}.ico.r{right:10px}
.ico svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico svg.on{fill:#fff}
.art{flex:1;display:grid;place-items:center;padding:30px 4px 4px;position:relative}
.art img{max-width:84%;max-height:104px;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.28))}
.art .emo{font-size:64px;line-height:1;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.gname{position:relative;display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-weight:700;font-size:14px;margin:6px 2px 8px}
.gname span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gname em{font-style:normal;opacity:.7;font-weight:600;font-size:12px;flex:none}
.gbtn{position:relative;background:rgba(255,255,255,.94);color:#12743F;border-radius:999px;text-align:center;padding:10px;font-weight:700;font-size:15px}
.hero{border-radius:20px;height:170px;display:grid;place-items:center;position:relative;overflow:hidden;margin-bottom:12px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.25),transparent 65%)}
.hero img{max-height:130px;max-width:70%;position:relative;filter:drop-shadow(0 10px 12px rgba(0,0,0,.3))}
.hero .emo{font-size:84px;position:relative}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw i{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw i.on{border-color:var(--card);box-shadow:0 0 0 2.5px var(--g)}
/* профиль / админка */
.ava{width:56px;height:56px;border-radius:50%;background:var(--g-soft);color:var(--g-dark);display:grid;place-items:center;font-size:24px;font-weight:700;flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:18px;letter-spacing:-.3px;margin-top:3px}
.stat.wide{grid-column:span 2}
.switch{width:46px;height:28px;border-radius:99px;background:var(--gray-bg);border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}
[data-theme="dark"] .switch{background:var(--g);border-color:var(--g)}
[data-theme="dark"] .switch::after{left:20px;background:#fff}
.warn{background:var(--amber-bg);color:var(--amber-tx);border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
</style>
</head>
<body>
<div class="top">
  <div class="logo"><i>m</i><div>mog <span>Маркет</span></div></div>
  <div class="row">
    <div class="pill" id="topBal">…</div>
    <button class="theme" id="themeBtn" aria-label="Тема" onclick="toggleTheme()"></button>
  </div>
</div>
<main id="main"></main>
<button class="btn fab" id="fab" style="display:none" onclick="newListing()">+ Выставить лот</button>

<nav class="tabs">
  <button data-t="market" class="on"><svg viewBox="0 0 24 24"><path d="M4 7h16l-1.5 11a2 2 0 0 1-2 1.7H7.5a2 2 0 0 1-2-1.7L4 7z"/><path d="M8.5 7a3.5 3.5 0 0 1 7 0"/></svg>Маркет</button>
  <button data-t="deals"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg>Сделки</button>
  <button data-t="wallet"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16.5 14.5h.01"/></svg>Кошелёк</button>
  <button data-t="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.7"/><path d="M4.5 20c.9-3.6 3.8-5.5 7.5-5.5s6.6 1.9 7.5 5.5"/></svg>Профиль</button>
</nav>

<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
const S = { me:null, tab:'market', cat:'', q:'', adm:'ov', draft:{} };
const CATS = ['Подарки','Аккаунты','Услуги','Другое'];
const STATUS = {
  open:['Ждёт покупателя','amber'], funded:['Оплачено','amber'], delivered:['Передано','amber'],
  completed:['Завершена',''], disputed:['Спор','red'], cancelled:['Отменена','gray'], refunded:['Возврат','gray']
};
const BG = {
  mint:'linear-gradient(160deg,#63D6A4,#1B8C61)', rose:'linear-gradient(160deg,#CF6F9D,#7B3459)',
  ocean:'linear-gradient(160deg,#5BBBD8,#2A6D90)', violet:'linear-gradient(160deg,#8F7DEC,#4A3CA8)',
  sunset:'linear-gradient(160deg,#F2975F,#A64A2B)', graphite:'linear-gradient(160deg,#53606B,#1B2229)'
};
const EMOJIS = ['🎁','🕯️','🧦','🖊️','🔔','💍','🧸','🚀','👑','💎','🍀','🎂'];
const ICON = {
  heart:'<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.7a4.3 4.3 0 0 1 7.5 2.6c0 5.6-7.5 10.2-7.5 10.2z"/></svg>',
  heartOn:'<svg class="on" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.7a4.3 4.3 0 0 1 7.5 2.6c0 5.6-7.5 10.2-7.5 10.2z"/></svg>',
  cart:'<svg viewBox="0 0 24 24"><path d="M3.5 4.5h2.2l1.8 10h9.6l1.7-7.2H7"/><circle cx="9.5" cy="19" r="1.2"/><circle cx="16.5" cy="19" r="1.2"/></svg>',
  sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>',
  moon:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>'
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ton = n => (n/1e9).toLocaleString('ru',{maximumFractionDigits:3}) + ' TON';
const date = t => new Date(t*1000).toLocaleString('ru',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const lsGet = (k,d) => { try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };

/* ───── Тема ───── */
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  $('#themeBtn').innerHTML = t==='dark' ? ICON.sun : ICON.moon;
  try{ tg?.setHeaderColor(t==='dark'?'#0E1511':'#F5F9F6'); tg?.setBackgroundColor(t==='dark'?'#0E1511':'#F5F9F6'); }catch(e){}
}
function toggleTheme(){
  const t = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark';
  lsSet('mog_theme', t); applyTheme(t); tg?.HapticFeedback?.impactOccurred('light');
}
if (tg) { tg.ready(); tg.expand(); }
applyTheme(lsGet('mog_theme', tg?.colorScheme==='dark' ? 'dark' : 'light'));

/* ───── Утилиты ───── */
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('show'),2600); }
async function api(path, method='GET', body){
  const r = await fetch('/api'+path, { method, headers:{'Content-Type':'application/json','X-Init-Data': tg?.initData || ''}, body: body?JSON.stringify(body):undefined });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || 'Ошибка');
  return j;
}
async function act(fn){ try{ return await fn(); }catch(e){ toast(e.message); tg?.HapticFeedback?.notificationOccurred('error'); } }
function openSheet(html){ $('#sheet').innerHTML='<div class="grab"></div>'+html; $('#ov').classList.add('show'); }
function closeSheet(){ $('#ov').classList.remove('show'); }
async function refreshMe(){ S.me = await api('/me'); $('#topBal').textContent = ton(S.me.balance); }
function copy(t){ navigator.clipboard?.writeText(t); toast('Скопировано'); tg?.HapticFeedback?.impactOccurred('light'); }
const FAV = new Set(JSON.parse(lsGet('mog_fav','[]')));
function toggleFav(id){ FAV.has(id)?FAV.delete(id):FAV.add(id); lsSet('mog_fav',JSON.stringify([...FAV])); renderList(); tg?.HapticFeedback?.selectionChanged(); }

/* ───── Вкладки ───── */
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; render(); });
async function render(){
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t===S.tab));
  $('#fab').style.display = S.tab==='market' ? 'block' : 'none';
  await act(refreshMe);
  if(S.tab==='market') return renderMarket();
  if(S.tab==='deals') return renderDeals();
  if(S.tab==='wallet') return renderWallet();
  if(S.tab==='profile') return renderProfile();
  if(S.tab==='admin') return renderAdmin();
}

/* ───── Маркет ───── */
function cardHTML(l){
  const art = l.image ? `<img src="${esc(l.image)}" alt="">` : `<div class="emo">${esc(l.emoji||'🎁')}</div>`;
  return `<div class="gcard" style="background:${BG[l.bg]||BG.mint}" onclick="openListing(${l.id})">
    <button class="ico l" onclick="event.stopPropagation();toggleFav(${l.id})">${FAV.has(l.id)?ICON.heartOn:ICON.heart}</button>
    <button class="ico r" onclick="event.stopPropagation();openListing(${l.id})">${ICON.cart}</button>
    <div class="art">${art}</div>
    <div class="gname"><span>${esc(l.title)}</span>${l.gift_num?`<em>#${l.gift_num}</em>`:''}</div>
    <div class="gbtn">${ton(l.price)}</div></div>`;
}
async function renderMarket(){
  $('#main').innerHTML = `
    <input id="q" placeholder="Поиск по лотам" value="${esc(S.q)}" style="margin:2px 0 10px">
    <div class="chips"><div class="chip ${S.cat===''?'on':''}" data-c="">Все</div>
      <div class="chip ${S.cat==='fav'?'on':''}" data-c="fav">♥ Избранное</div>
      ${CATS.map(c=>`<div class="chip ${S.cat===c?'on':''}" data-c="${c}">${c}</div>`).join('')}</div>
    <div id="list"></div>`;
  $('#q').oninput = e => { S.q = e.target.value; clearTimeout(renderMarket.t); renderMarket.t=setTimeout(loadList,250); };
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { S.cat=c.dataset.c; renderMarket(); });
  loadList();
}
async function loadList(){
  const cat = S.cat==='fav' ? '' : S.cat;
  const items = await act(()=>api(`/listings?q=${encodeURIComponent(S.q)}&cat=${encodeURIComponent(cat)}`));
  if(!items) return;
  window._items = items; renderList();
}
function renderList(){
  if(S.tab!=='market' || !$('#list')) return;
  let items = window._items || [];
  if(S.cat==='fav') items = items.filter(l=>FAV.has(l.id));
  $('#list').innerHTML = items.length ? `<div class="grid">${items.map(cardHTML).join('')}</div>`
    : `<div class="empty">${S.cat==='fav'?'В избранном пока ничего':'Пока здесь пусто.<br>Выставьте первый лот 👇'}</div>`;
}
function openListing(id){
  const l = (window._items||[]).find(x=>x.id===id); if(!l) return;
  const art = l.image ? `<img src="${esc(l.image)}" alt="">` : `<div class="emo">${esc(l.emoji||'🎁')}</div>`;
  openSheet(`
    <div class="hero" style="background:${BG[l.bg]||BG.mint}">${art}</div>
    <div class="row sp"><span class="tag">${esc(l.category)}</span>${l.gift_num?`<span class="muted">#${l.gift_num}</span>`:''}</div>
    <h2 style="margin-top:10px">${esc(l.title)}</h2>
    <p class="muted" style="white-space:pre-wrap;font-size:14px;margin-top:-4px">${esc(l.descr) || 'Без описания'}</p>
    <div class="kv"><span>Цена</span><b>${ton(l.price)}</b></div>
    <div class="kv"><span>Продавец</span><b>${esc(l.seller_name)}</b></div>
    <div class="kv"><span>Защита</span><b>Гарант-сделка</b></div>
    <p class="muted">Деньги замораживаются и уходят продавцу только после вашего подтверждения получения.</p>
    ${l.mine
      ? `<button class="btn red" onclick="delListing(${l.id})">Снять с продажи</button>`
      : `<button class="btn" onclick="buy(${l.id})">Купить за ${ton(l.price)}</button>`}
    ${S.me?.admin && !l.mine ? `<div style="height:8px"></div><button class="btn ghost" onclick="admRemoveLot(${l.id})">Модерация: снять лот</button>`:''}`);
}

function pickImage(){
  const i = document.createElement('input'); i.type='file'; i.accept='image/*';
  i.onchange = () => {
    const f = i.files[0]; if(!f) return;
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 320/Math.max(img.width,img.height));
      const c = document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      let d = c.toDataURL('image/webp',.82); if(d.length>240000) d = c.toDataURL('image/jpeg',.7);
      if(d.length>240000) return toast('Изображение слишком большое');
      S.draft.image = d; $('#pvArt').outerHTML=`<img id="pvArt" src="${d}" alt="">`;
    };
    img.src = URL.createObjectURL(f);
  };
  i.click();
}

async function openDeal(code){
  if(!code) return;
  const d = await act(()=>api('/deals/'+encodeURIComponent(code))); if(!d) return;
  const s = STATUS[d.status], link = `https://t.me/${S.me.bot}?start=deal_${d.code}`;
  const fee = Math.floor(d.price*d.fee_percent/100);
  let actions = '';
  if(d.status==='open' && d.role==='guest') actions = `
    <p class="muted">Нажав «Присоединиться», вы заморозите ${ton(d.price)} на своём балансе. Продавец получит их только после вашего подтверждения.</p>
    <button class="btn" onclick="dealAct('${d.code}','join')">Присоединиться за ${ton(d.price)}</button>`;
  else if(d.status==='open' && d.role==='seller') actions = `
    <div class="copy" onclick="copy('${link}')">${link}</div>
    <div style="height:10px"></div>
    <button class="btn soft" onclick="copy('${link}')">Скопировать ссылку</button>
    <div style="height:8px"></div>
    <button class="btn red" onclick="dealAct('${d.code}','cancel')">Отменить сделку</button>`;
  else if(d.status==='funded' && d.role==='seller') actions = `<button class="btn" onclick="dealAct('${d.code}','deliver')">Я передал товар</button>`;
  else if(d.status==='funded' && d.role==='buyer') actions = `<p class="muted">Ждём, пока продавец передаст товар.</p>`;
  else if(d.status==='delivered' && d.role==='buyer') actions = `<button class="btn" onclick="dealAct('${d.code}','confirm')">Получил, всё хорошо</button>`;
  else if(d.status==='delivered' && d.role==='seller') actions = `<p class="muted">Ждём подтверждения от покупателя.</p>`;
  if(['funded','delivered'].includes(d.status) && d.role!=='guest') actions += `<div style="height:8px"></div><button class="btn red" onclick="dealAct('${d.code}','dispute')">Открыть спор</button>`;
  openSheet(`
    <span class="tag ${s[1]}">${s[0]}</span>
    <h2 style="margin-top:10px">${esc(d.title)}</h2>
    <p class="muted" style="white-space:pre-wrap;font-size:14px;margin-top:-4px">${esc(d.descr)}</p>
    <div class="kv"><span>Сумма</span><b>${ton(d.price)}</b></div>
    <div class="kv"><span>Продавец</span><b>${esc(d.seller_name)}</b></div>
    <div class="kv"><span>Покупатель</span><b>${esc(d.buyer_name||'пока нет')}</b></div>
    ${d.role==='seller'?`<div class="kv"><span>Вы получите (комиссия ${d.fee_percent}%)</span><b>${ton(d.price-fee)}</b></div>`:''}
    <div class="kv"><span>Код</span><b>${esc(d.code)}</b></div>
    <div style="height:12px"></div>${actions}`);
}

const admWd = (id,a) => act(async()=>{ await api(`/admin/withdrawals/${id}/${a}`,'POST'); toast(a==='ok'?'Отмечено выплаченным':'Отклонено, средства возвращены'); renderAdmin(); });
const admDp = (code,s) => act(async()=>{ await api(`/admin/disputes/${encodeURIComponent(code)}/${s}`,'POST'); toast('Спор решён'); renderAdmin(); });

(async function(){
  if(!tg?.initData){ $('#main').innerHTML='<div class="empty">Откройте приложение через Telegram-бота</div>'; return; }
  await render();
  const p = new URLSearchParams(location.search).get('deal') || (tg.initDataUnsafe?.start_param||'').replace(/^deal_/,'');
  if(p){ S.tab='deals'; await render(); openDeal(p); }
})();
</script>
